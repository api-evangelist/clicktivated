description: >-
  Clicktivated publishes no versioning policy, no deprecation policy, no SLA, no
  changelog and no status page. Because none of these exist, NO StatusPage and NO
  Deprecation pointer is emitted in apis.yml — this file records verified absence.

versioning:
  scheme: none-published
  current_version: null
  version_in_path: false
  version_header: null
  note: >-
    The GraphQL endpoint is unversioned (/graphql, no /v1 prefix) and the player embed
