name: Clicktivated
description: Clicktivated is a video technology platform that turns existing video
  content into interactive, shoppable experiences without re-shooting or re-editing.
  Its "Activate, Distribute, Optimize" workflow makes any video clickable the same
  day, deploys it programmatically across DSPs, SSPs, publishers, and direct site
  embeds, and captures first-party intent signals - item-level and place-level - to
  improve targeting, measure lift, and drive better performance. The company serves
  retail brands closing the gap between inspiration and purchase, and tourism brands
  converting inspiration into itineraries. Founded as Clicktivated Video, Inc. and
  backed by Techstars, with offices in Detroit, New York, Dubai, and Sydney.
